<meta charset="utf-8">
<title>FenceScan — 15s — Draw it, feed cut (4:5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
  :root { --ink: #071320; --panel: #0b1d2e; --trace: #22d3ee; --a400: #67e8f9; --a300: #a5f3fc; }
  html, body { width: 1080px; height: 1350px; background: #071320; }
  .grid-bg { background:
      linear-gradient(rgba(34,211,238,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.055) 1px, transparent 1px);
    background-size: 54px 54px; }
  .glow { background: #0e7490; }
  .pickets { background: repeating-linear-gradient(180deg, #155e75 0 34px, transparent 34px 46px); }
  .brand { top: 62px; font-size: 34px; }
  .brand .sq { width: 13px; height: 13px; background: var(--trace); }
  .eyebrow { color: #67e8f9; }
  .eyebrow::before { background: var(--trace); }
  .btn { background: linear-gradient(135deg, #0e7490, #22d3ee); color: #062a33;
    box-shadow: 0 0 0 1px rgba(34,211,238,.4), 0 30px 80px -14px rgba(34,211,238,.45); }
  .head { position: absolute; left: 70px; right: 70px; top: 156px; font-size: 54px; }

  #app { position: absolute; left: 50px; top: 360px; width: 980px; }
  .bar { background: #fff; border-radius: 18px 18px 0 0; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E4E4E7; }
  .pills { display: inline-flex; border-radius: 999px; background: #F4F4F5; padding: 3px; gap: 2px; }
  .pill-t { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
    padding: 10px 15px; font-size: 20px; font-weight: 600; color: #71717A; white-space: nowrap; }
  .pill-t.on { background: #fff; color: #18181B; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .pill-t svg { width: 19px; height: 19px; }
  .lf { margin-left: auto; background: #1E7340; color: #fff; border-radius: 999px;
    padding: 9px 18px; font-size: 20px; font-weight: 700; white-space: nowrap; }
  .canvas { position: relative; width: 980px; height: 632px; overflow: hidden;
    border-radius: 0 0 18px 18px; background: #26331f;
    box-shadow: 0 0 0 1px rgba(34,211,238,.35), 0 46px 110px -30px rgba(0,0,0,.95); }
  .canvas img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .canvas svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cur { position: absolute; z-index: 40; width: 40px; height: 40px; opacity: 0; margin: -4px 0 0 -6px; }
  .cur svg { filter: drop-shadow(0 4px 10px rgba(0,0,0,.65)); }

  .callout { position: absolute; left: 50px; right: 50px; top: 1090px; text-align: center;
    font-size: 32px; font-weight: 700; opacity: 0; }
  .callout b { color: var(--trace); }

  #s3 h2 { position: absolute; left: 70px; right: 70px; top: 330px; font-size: 92px; }
  #s3 .btn { position: absolute; left: 70px; top: 830px; padding: 38px 54px; font-size: 33px; }
  #s3 .site { position: absolute; left: 70px; top: 970px; font-size: 30px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(165,243,252,.55); font-family: "Space Mono", monospace; }
</style>

<div class="grid-bg"></div>
<div class="glow" style="width:700px;height:700px;left:-220px;top:-180px"></div>
<div class="pickets"></div>
<div class="brand">FENCESCAN <span class="sq"></span></div>

<!-- 1+2 in one: the tool, fast -->
<section class="scene" id="s2">
  <h2 class="head display" id="h2">Boundary's on it.<br><span class="hl">Click Draw fence. Tap.</span></h2>
  <div id="app">
    <div class="bar">
      <div class="pills">
        <span class="pill-t on" id="tSelect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
          Select
        </span>
        <span class="pill-t" id="tDraw">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Draw fence
        </span>
        <span class="pill-t" id="tGate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M13 4.8v14.4a.6.6 0 0 1-.7.6l-4-.6a.6.6 0 0 1-.5-.6V5.4a.6.6 0 0 1 .5-.6l4-.6a.6.6 0 0 1 .7.6z"/></svg>
          Add gate
        </span>
        <span class="pill-t">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/></svg>
          Section
        </span>
      </div>
      <span class="lf" id="lf">0 LF · 0 gates</span>
    </div>
    <div class="canvas">
      <img src="plates/aerial-clean.svg" alt="">
      <svg class="ov" viewBox="0 0 900 580">
        <polygon points="196,88 704,78 716,500 206,508"
          fill="rgba(74,222,128,0.06)" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 4"/>
        <polyline id="committed" fill="none" stroke="#22d3ee" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round" points=""
          style="filter:drop-shadow(0 0 4px rgba(34,211,238,0.6));opacity:0"/>
        <g id="cverts"></g>
        <g id="runchip" style="opacity:0">
          <rect width="48" height="18" rx="5" fill="rgba(9,20,12,0.85)"/>
          <text x="24" y="13" text-anchor="middle" font-size="11" font-weight="700"
            fill="#a7f3d0" font-family="Inter, sans-serif">355 ft</text>
        </g>
        <g id="gates"></g>
        <polyline id="draft" fill="none" stroke="#fbbf24" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" points=""/>
        <line id="rubber" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5"
          stroke-linecap="round" style="opacity:0"/>
        <g id="dverts"></g>
        <g id="snap" style="opacity:0">
          <circle r="8" fill="none" stroke="#22C55E" stroke-width="2.5"/>
          <circle r="2.2" fill="#22C55E"/>
        </g>
        <g id="chip" style="opacity:0">
          <rect width="10" height="20" rx="6" fill="rgba(9,20,12,0.9)"/>
          <text x="8" y="14" font-size="11" font-weight="700" fill="#fde68a"
            font-family="Inter, sans-serif">40 ft</text>
        </g>
      </svg>
      <div class="cur" id="cur">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff" stroke="#0D1B12" stroke-width="1.4">
          <path d="M4 2 L20 12 L13 13.5 L16.5 20.5 L13.5 22 L10 15 L4 19 Z"/>
        </svg>
      </div>
    </div>
  </div>
  <p class="callout" id="callout"></p>
</section>

<!-- 3. CTA -->
<section class="scene" id="s3">
  <h2 class="display">Tap. Tap. Tap.<br><span class="hl">Measured.</span></h2>
  <span class="btn">Draw a yard free →</span>
  <p class="site">fencescan.com</p>
</section>

<script src="kit.js"></script>
<script>
  const PX_PER_FT = 3.6;
  const PARCEL = [[196,88],[704,78],[716,500],[206,508]];
  const RUN = [[346,348],[210,348],[204,96],[696,87],[705,402],[622,402]];
  const GATES = [
    { x: 282, y: 348, w: 4,  dir: [1,0] },
    { x: 663, y: 402, w: 10, dir: [1,0] },
  ];
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const ptsAttr = (a) => a.map((p) => p[0] + "," + p[1]).join(" ");
  const PLACE = [2600, 3600, 4600, 5600, 6600, 7500];
  const FINISH = 8200;

  scene("#s2", 0, 12400, 260);
  rise("#h2", 100, 700, 36);
  rise("#app", 200, 900, 56);

  (function () {
    const c = $("#callout");
    up((ms) => {
      let t = "", o = 0;
      if (ms > 8600 && ms < 12000) { t = "<b>355 LF</b> committed — gates drop straight on."; o = 1; }
      if (t) c.innerHTML = t;
      c.style.opacity = o;
    });
  })();

  (function () {
    const sel = $("#tSelect"), draw = $("#tDraw"), gate = $("#tGate");
    up((ms) => {
      const mode = ms < 1500 ? "select" : ms < 8900 ? "draw" : "gate";
      sel.classList.toggle("on", mode === "select");
      draw.classList.toggle("on", mode === "draw");
      gate.classList.toggle("on", mode === "gate");
    });
  })();

  (function () {
    const lf = $("#lf");
    up((ms) => {
      if (ms < FINISH) { lf.textContent = "0 LF · 0 gates"; return; }
      const g = ms > 11000 ? 2 : ms > 9800 ? 1 : 0;
      lf.textContent = `355 LF · ${g} ${g === 1 ? "gate" : "gates"}`;
    });
  })();

  (function () {
    const draft = $("#draft"), rubber = $("#rubber"), dverts = $("#dverts");
    const committed = $("#committed"), cverts = $("#cverts"), runchip = $("#runchip");
    const chip = $("#chip"), chipRect = $("#chip rect"), chipText = $("#chip text");
    const snap = $("#snap"), cur = $("#cur");

    up((ms) => {
      let n = 0;
      for (const t of PLACE) if (ms >= t) n++;
      const placed = RUN.slice(0, n);

      let cursor = null;
      if (ms >= 1500 && ms < FINISH) {
        if (n === 0) {
          const t = eio(p(ms, 1600, PLACE[0]));
          cursor = [lerp(470, RUN[0][0], t), lerp(250, RUN[0][1], t)];
        } else if (n < RUN.length) {
          const t = eio(p(ms, PLACE[n - 1], PLACE[n]));
          cursor = [lerp(RUN[n - 1][0], RUN[n][0], t), lerp(RUN[n - 1][1], RUN[n][1], t)];
        } else cursor = RUN[RUN.length - 1].slice();
      }

      draft.setAttribute("points", n > 1 ? ptsAttr(placed) : "");
      dverts.innerHTML = placed
        .map((q) => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#fbbf24"/>`).join("");

      if (cursor && n > 0 && ms < FINISH) {
        rubber.setAttribute("x1", placed[n - 1][0]);
        rubber.setAttribute("y1", placed[n - 1][1]);
        rubber.setAttribute("x2", cursor[0]);
        rubber.setAttribute("y2", cursor[1]);
        rubber.style.opacity = 1;
        const segFt = Math.round(dist(placed[n - 1], cursor) / PX_PER_FT);
        let total = 0;
        for (let i = 1; i < placed.length; i++) total += dist(placed[i - 1], placed[i]);
        total += dist(placed[n - 1], cursor);
        const totalFt = Math.round(total / PX_PER_FT);
        const label = placed.length > 1 ? `+${segFt} ft · ${totalFt} ft total` : `${segFt} ft`;
        chipText.textContent = label;
        chipRect.setAttribute("width", label.length * 6.2 + 14);
        chip.setAttribute("transform", `translate(${cursor[0] + 14},${cursor[1] - 16})`);
        chip.style.opacity = 1;
      } else { rubber.style.opacity = 0; chip.style.opacity = 0; }

      let lock = null;
      if (cursor) for (const c of PARCEL) if (dist(c, cursor) < 24) lock = c;
      if (lock) {
        snap.setAttribute("transform", `translate(${lock[0]},${lock[1]})`);
        snap.style.opacity = 1;
      } else snap.style.opacity = 0;

      if (cursor) {
        cur.style.opacity = 1;
        cur.style.left = (cursor[0] / 900) * 980 + "px";
        cur.style.top = (cursor[1] / 580) * 632 + "px";
      } else if (ms > 900 && ms < 1600) {
        const t = eio(p(ms, 900, 1500));
        cur.style.opacity = 1;
        cur.style.left = lerp(430, 205, t) + "px";
        cur.style.top = lerp(140, -34, t) + "px";
      } else if (ms > 8900 && ms < 12000) {
        const g = ms < 9800 ? GATES[0] : GATES[1];
        const t = eio(p(ms, ms < 9800 ? 9000 : 10000, ms < 9800 ? 9700 : 10900));
        const from = ms < 9800 ? [520, 300] : [400, 360];
        cur.style.opacity = 1;
        cur.style.left = ((lerp(from[0], g.x, t)) / 900) * 980 + "px";
        cur.style.top = ((lerp(from[1], g.y, t)) / 580) * 632 + "px";
      } else cur.style.opacity = 0;

      const done = ms >= FINISH;
      committed.style.opacity = done ? 1 : 0;
      committed.setAttribute("points", done ? ptsAttr(RUN) : "");
      cverts.innerHTML = done
        ? RUN.map((q) => `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#fff" stroke="#0891b2" stroke-width="1.4"/>`).join("")
        : "";
      if (done) {
        const mid = RUN[Math.floor(RUN.length / 2)];
        runchip.setAttribute("transform", `translate(${mid[0] - 24},${mid[1] - 30})`);
        runchip.style.opacity = 1;
        draft.setAttribute("points", "");
        dverts.innerHTML = "";
      } else runchip.style.opacity = 0;

      const gs = [];
      if (ms > 9800) gs.push(GATES[0]);
      if (ms > 11000) gs.push(GATES[1]);
      $("#gates").innerHTML = gs
        .map((g) => {
          const half = (g.w * PX_PER_FT) / 2;
          const x1 = g.x - g.dir[0] * half, y1 = g.y - g.dir[1] * half;
          const x2 = g.x + g.dir[0] * half, y2 = g.y + g.dir[1] * half;
          return (
            `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0b1210" stroke-width="7" opacity="0.55"/>` +
            `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f472b6" stroke-width="4" stroke-dasharray="6 4"/>` +
            `<circle cx="${x1}" cy="${y1}" r="3.5" fill="#fff" stroke="#f472b6" stroke-width="1.4"/>` +
            `<circle cx="${x2}" cy="${y2}" r="3.5" fill="#fff" stroke="#f472b6" stroke-width="1.4"/>` +
            `<rect x="${g.x - 17}" y="${g.y - 26}" width="34" height="16" rx="8" fill="#f472b6"/>` +
            `<text x="${g.x}" y="${g.y - 15}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff" font-family="Inter, sans-serif">${g.w}'</text>`
          );
        }).join("");
    });
  })();

  scene("#s3", 12200, 15000, 320);
  rise("#s3 h2", 12400, 13100, 52);
  pop("#s3 .btn", 13300, 13900);
  rise("#s3 .site", 13900, 14300, 20);

  window.TOTAL_MS = 15000;
  window.seek(0);
</script>
